<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t.title }} - MUCAMBO Compliance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-7 shadow-2xl space-y-5 text-center">
    
    <!-- Language Switcher Bar -->
    <div class="flex justify-center gap-3 text-xs border-b border-slate-700 pb-3">
      <a href="?action={{ action }}&target={{ target }}&lang=pt" class="{% if lang == 'pt' %}text-blue-400 font-bold{% else %}text-slate-400 hover:text-white{% endif %}">Português</a>
      <span>•</span>
      <a href="?action={{ action }}&target={{ target }}&lang=en" class="{% if lang == 'en' %}text-blue-400 font-bold{% else %}text-slate-400 hover:text-white{% endif %}">English</a>
      <span>•</span>
      <a href="?action={{ action }}&target={{ target }}&lang=es" class="{% if lang == 'es' %}text-blue-400 font-bold{% else %}text-slate-400 hover:text-white{% endif %}">Español</a>
    </div>

    <!-- Icon -->
    <div class="w-14 h-14 mx-auto rounded-full bg-blue-900/30 border border-blue-600/30 flex items-center justify-center text-blue-400 text-2xl">
      ✓
    </div>

    <!-- Main Message -->
    <div class="space-y-2">
      <h1 class="text-xl font-bold text-white">{{ t.headline }}</h1>
      <p class="text-xs text-slate-300 leading-relaxed">{{ t.subtext }}</p>
    </div>

    <!-- Target Details Box -->
    <div class="bg-slate-900 border border-slate-700 p-3 rounded-lg text-xs font-mono text-slate-400 text-left space-y-1">
      <div><strong>Status:</strong> <span class="text-emerald-400">{{ t.status_confirmed }}</span></div>
      <div><strong>Identificador:</strong> <span class="text-slate-200">{{ target or "Empresa / Contato" }}</span></div>
      <div><strong>Protocolo:</strong> <span class="text-slate-400 font-mono text-[10px]">{{ protocol_id }}</span></div>
    </div>

    <!-- Footer Disclaimer -->
    <p class="text-[11px] text-slate-400 border-t border-slate-700/80 pt-3 leading-relaxed">
      {{ t.compliance_footer }}
    </p>

    <div class="pt-2">
      <a href="/" class="text-xs text-blue-400 hover:underline">
        {{ t.return_home }}
      </a>
    </div>

  </div>
</body>
</html>
